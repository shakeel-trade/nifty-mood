name: Daily NIFTY 50 mood

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 17:30 IST, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the mood pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOOD_OUTPUT_DIR: docs
        run: python mood_pipeline.py
      - name: Publish the dashboard
        run: |
          cp docs/dashboard.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Market mood for $(date -u +%F)" || echo "Nothing new to commit"
          git push
